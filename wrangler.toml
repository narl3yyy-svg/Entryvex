name = "entryvex"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Only serve the site on entryvex.trade (no public *.workers.dev or preview addresses).
workers_dev = false
preview_urls = false

# Serve the website from ./public. Requests for real files never hit the Worker;
# everything else (like /api/news) runs src/worker.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare Workers AI (free daily allowance) for plain-English news summaries.
[ai]
binding = "AI"

# Storage for closed-app alerts (anonymous push addresses + alert settings).
# Cloudflare creates this automatically on deploy.
[[kv_namespaces]]
binding = "PUSH"

# Check closed-app alerts every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]
